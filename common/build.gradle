architectury {
    common('fabric')
}

repositories {
    maven { url "https://repo.spongepowered.org/repository/maven-public/" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    modCompileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    compileOnly "org.spongepowered:mixin:0.8.5"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    implementation(annotationProcessor(
        "io.github.llamalad7:mixinextras-common:${rootProject.mixin_extras_version}"
    ))
    modCompileOnly "maven.modrinth:sodium:mc1.19.2-0.4.4-fabric"
}
